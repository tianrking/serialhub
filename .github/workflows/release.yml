name: Release

# Releases built on a server must not spend hosted Actions quota on tag creation.
# The complete native workflow remains available through an explicit manual run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate and publish (for example v0.1.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate the immutable release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check version agreement, tag identity and main ancestry
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python scripts/release.py check --tag "$RELEASE_TAG" --require-main --github-output "$GITHUB_OUTPUT"

  build:
    name: Full CI and six native packages
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      release-tag: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: read

  publish:
    name: Verify downloads and publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          pattern: serialhub-*
          path: release-assets
          merge-multiple: true
      - name: Require six correct archives and produce SHA256SUMS
        run: python scripts/release.py verify --directory release-assets --tag "$RELEASE_TAG" --require-all --write-checksums
      - name: Upload a draft, keeping existing published versions immutable
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > draft-state.txt; then
            test "$(cat draft-state.txt)" = true || { echo "Release is already published; refusing to overwrite it."; exit 1; }
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "SerialHub $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
      - name: Download every uploaded asset and compare SHA-256
        run: |
          gh release download "$RELEASE_TAG" --dir release-downloads
          python scripts/release.py compare --directory release-assets --actual release-downloads
      - name: Publish the complete verified release
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest
          echo "Published: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
