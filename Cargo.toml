[package]
name = "serialhub"
version = "0.0.4"
edition = "2021"
default-run = "serialhub"
autobins = false
description = "Cross-platform open-source serial hub for humans and agents"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tianrking/serialhub"
keywords = [
    "serial",
    "uart",
    "hub",
    "websocket",
    "embedded",
    "com-port",
    "tty",
    "agent",
    "multiplexer",
    "cross-platform",
]
categories = ["command-line-utilities", "network-programming", "asynchronous"]

[[bin]]
name = "serialhub"
path = "src/main.rs"

# Compatibility executable retained during the 0.x branding migration. It
# deliberately runs the same CLI implementation as `serialhub`.
[[bin]]
name = "ohmyserial"
path = "src/bin/ohmyserial.rs"

[[bin]]
name = "serialhub-desktop"
path = "src/bin/serialhub-desktop.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Linux falls back to /sys/class/tty enumeration, avoiding a mandatory
# libudev development package while preserving direct serial-port access.
serialport = { version = "4", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
opener = "0.7"
dirs = "6"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSEvent"] }
objc2-foundation = { version = "0.3.2", features = ["NSDate", "NSRunLoop", "NSString"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term", "fs", "poll", "process", "user"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.26"

[profile.release]
lto = true
codegen-units = 1
strip = true
